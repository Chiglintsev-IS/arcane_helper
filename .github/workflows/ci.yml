name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # `npm install`, а не `npm ci`: дерево зависимостей тянет пакеты, которые существуют только
      # на Linux (`@emnapi/runtime` из wasm-сборок sharp и oxide), а lock-файл пишется на macOS и
      # про них не знает — `npm ci` на этом останавливается. Версии всё равно закреплены lock-файлом;
      # разница в том, что install дописывает недостающее под платформу, а не отказывается.
      - run: npm install --no-audit --no-fund

      # Целостность спецификации: ссылки, якоря, покрытие требований.
      - name: Проверка спецификации
        run: python3 scripts/check-docs.py

      - name: Проверка типов
        run: npm run typecheck

      # Движок правил и схемы покрываются полностью — порог 100% задан в vitest.config.ts.
      - name: Тесты и покрытие
        run: npm run test:coverage

      - name: Сборка статического экспорта
        run: npm run build

      # E2E на WebKit: это движок Safari на iOS, то есть та же среда, что на телефоне игрока.
      - name: Установка браузера для E2E
        run: npx playwright install --with-deps webkit

      # Сценарий UC-01 в viewport iPhone SE плюс проверка доступности axe-core.
      - name: E2E и доступность
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
