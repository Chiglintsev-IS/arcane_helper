name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # `npm install`, а не `npm ci`: дерево зависимостей тянет пакеты, которые существуют только
      # на Linux (`@emnapi/runtime` из wasm-сборок sharp и oxide), а lock-файл пишется на macOS и
      # про них не знает — `npm ci` на этом останавливается. Версии всё равно закреплены lock-файлом;
      # разница в том, что install дописывает недостающее под платформу, а не отказывается.
      - run: npm install --no-audit --no-fund

      # Один вход, как и локально: спецификация, границы, мёртвый код, правила владения, типы,
      # тесты с покрытием, сборка. Новый страж попадает в CI правкой package.json, а не этого файла.
      - name: Проверка репозитория
        run: npm run verify

      # E2E на WebKit: это движок Safari на iOS, то есть та же среда, что на телефоне игрока.
      - name: Установка браузера для E2E
        run: npx playwright install --with-deps webkit

      # Сценарий UC-01 в viewport iPhone SE плюс проверка доступности axe-core — поверх сборки,
      # которую уже сделал verify.
      - name: E2E и доступность
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
