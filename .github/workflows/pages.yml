name: Pages

# Сборка и публикация статического экспорта на GitHub Pages.
#
# Отдельно от CI намеренно: проверки должны падать на любой ветке и в пул-реквесте, а публикуется
# только main. Смешивать их значило бы либо публиковать непроверенное, либо гонять сборку страницы
# на каждой ветке.
#
# BASE_PATH обязателен: Pages отдаёт проект по адресу вида `/имя-репозитория/`, и без него
# абсолютные пути к файлам сборки ведут в пустоту (next.config.ts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз; начатую не обрываем, чтобы не оставить страницу в половинчатом виде.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # `npm install`, а не `npm ci`: дерево зависимостей тянет пакеты, которые существуют только
      # на Linux (`@emnapi/runtime` из wasm-сборок sharp и oxide), а lock-файл пишется на macOS и
      # про них не знает — `npm ci` на этом останавливается. Версии всё равно закреплены lock-файлом;
      # разница в том, что install дописывает недостающее под платформу, а не отказывается.
      - run: npm install --no-audit --no-fund

      # Отдаёт base_path вида `/имя-репозитория` — руками его вписывать нельзя: репозиторий
      # переименуют, и адрес молча сломается.
      - uses: actions/configure-pages@v5
        id: pages

      # Публикуется только то, что прошло тот же вход, что и локально.
      - name: Проверка репозитория
        run: npm run verify

      # Отдельная сборка для публикации: BASE_PATH нужен только здесь — сборка внутри verify выше
      # уже проверила, что приложение собирается, и собрала с путём по умолчанию.
      - name: Сборка для Pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
