<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column">
<div style="flex:none;display:flex;align-items:baseline;gap:8px;padding:14px 14px 9px;border-bottom:3px double var(--gold)">
<span style="font:600 11px/1 'IBM Plex Sans';letter-spacing:.16em;color:var(--gold)">РЕЖИМЫ</span>
<span style="font:400 10px/1 'IBM Plex Mono',monospace;color:var(--tx3)">восемь, все на виду</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;overflow-y:auto">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
<button type="button" onClick="{{ it.pick }}" style="flex:1 1 0;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;background:{{ it.bg }};border:0;border-bottom:1px solid var(--line);border-left:3px solid {{ it.mark }};font-family:inherit;text-align:left;cursor:pointer">
<span style="flex:none;width:18px;font-size:15px;color:{{ it.col }}">{{ it.glyph }}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font:600 15px/1.1 Spectral,serif;color:{{ it.col }}">{{ it.label }}</span>
<span style="font:400 10.5px/1.2 'IBM Plex Mono',monospace;color:var(--tx3)">{{ it.sub }}</span>
</span>
<span style="flex:none;font:400 10px/1 'IBM Plex Mono',monospace;color:var(--gold)">{{ it.now }}</span>
</button>
</sc-for>
</div>
<button type="button" onClick="{{ toggle }}" style="flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;background:var(--ctl);border:0;border-top:1px solid var(--goldl);font-family:inherit;color:var(--tx2);cursor:pointer">
<span style="font:400 12px/1 'IBM Plex Sans'">Закрыть</span><span style="font-size:12px;color:var(--gold)">▾</span>
</button>
</div>
</sc-if>
<div style="flex:none;background:var(--grp)">
<button type="button" onClick="{{ toggle }}" style="display:flex;align-items:center;gap:9px;width:100%;height:54px;padding:0 12px;background:var(--grp);border:0;border-top:1px solid var(--goldl);font-family:inherit;cursor:pointer;color:var(--tx)">
<span style="flex:none;font-size:14px;color:var(--gold)">{{ curGlyph }}</span>
<span style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0">
<span style="font:600 14px/1.1 Spectral,serif;color:var(--tx)">{{ curLabel }}</span>
<span style="font:400 9.5px/1 'IBM Plex Mono',monospace;color:var(--tx3)">{{ curSub }}</span>
</span>
<span style="flex:1"></span>
<span style="flex:none;display:flex;align-items:center;gap:6px;font:400 10.5px/1 'IBM Plex Mono',monospace;color:var(--tx2)">все режимы <span style="font-size:11px;color:var(--gold)">▴</span></span>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;game&quot;,&quot;book&quot;,&quot;things&quot;,&quot;rest&quot;,&quot;log&quot;,&quot;sheet&quot;,&quot;craft&quot;,&quot;notes&quot;],&quot;default&quot;:&quot;game&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null, active: null };
  renderVals() {
    const raw = [
      ['game', 'Игра', '◆', 'чем сходить сейчас'],
      ['book', 'Книга', '▤', 'состав и подготовка'],
      ['things', 'Вещи', '▣', 'экипировка · сумка · покупки'],
      ['rest', 'Привал', '◐', 'короткий · долгий · восстановление'],
      ['log', 'Логи', '⟲', 'что случилось и как отменить'],
      ['sheet', 'Лист', '▥', 'кто он'],
      ['craft', 'Ремесло', '⚒', 'ингредиенты и верстак'],
      ['journal', 'Журнал', '✎', 'заметки по ходу игры']
    ];
    const act = this.state.active || this.props.active || 'game';
    const open = this.state.open === null ? !!this.props.open : this.state.open;
    const cur = raw.find(r => r[0] === act) || raw[0];
    return {
      open,
      curGlyph: cur[2], curLabel: cur[1],
      curSub: open ? 'нажми режим' : 'нажми, чтобы сменить режим',
      toggle: () => this.setState({ open: !open }),
      items: raw.map(([k, label, glyph, sub]) => ({
        label, glyph, sub,
        bg: k === act ? 'var(--grp)' : 'transparent',
        mark: k === act ? 'var(--gold)' : 'transparent',
        col: k === act ? 'var(--gold)' : 'var(--tx)',
        now: k === act ? 'сейчас' : '',
        pick: () => this.setState({ active: k, open: false })
      }))
    };
  }
}
</script>
</body>
</html>
