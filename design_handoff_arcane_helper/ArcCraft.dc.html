<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;width:100%;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden">
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;height:18px;padding:0 11px;font:500 10px/1 'IBM Plex Mono',monospace;color:var(--tx3)"><span>21:47</span><span>▮▮▯ ⌁</span></div>
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:6px 10px;border-bottom:3px double var(--gold)">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font:600 11px/1 'IBM Plex Sans';letter-spacing:.16em;color:var(--gold)">РЕМЕСЛО</span>
<span style="font:400 10px/1.3 'IBM Plex Mono',monospace;color:var(--tx3)">верстак и рецепты</span>
</div>
</div>

<div data-craft-scroll="1" style="flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px;display:flex;flex-direction:column;gap:11px">

<div style="background:var(--grp);border:1px solid var(--line2);border-top:2px solid var(--gold);padding:8px 9px 9px">
<div style="font:600 9.5px/1 'IBM Plex Sans';letter-spacing:.12em;color:var(--gold)">ВЕРСТАК</div>
<div style="margin-top:5px;font:600 16px/1.2 Spectral,serif">Свиток опознания</div>
<div style="margin-top:2px;font:400 10.5px/1.35 'IBM Plex Mono',monospace;color:var(--tx3)">8 часов · ячейка 1 уровня · выйдет один свиток</div>

<div style="margin-top:8px;display:flex;flex-direction:column">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:9px;min-height:48px;padding:5px 0;border-top:1px solid var(--line)">
<span style="flex:none;width:13px;height:13px;background:{{ s.markBg }};border:1px {{ s.markBd }}"></span>
<span style="flex:1;min-width:0;font:400 12.5px/1.35 'IBM Plex Sans';color:{{ s.nameC }};text-wrap:pretty">{{ s.name }}</span>
<span style="flex:none;font:500 11px/1.3 'IBM Plex Mono',monospace;color:{{ s.subC }};text-align:right;white-space:nowrap">{{ s.sub }}</span>
</div>
</sc-for>
</div>

<button type="button" style="margin-top:9px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;width:100%;min-height:48px;padding:6px 10px;background:var(--bg);border:1px dashed var(--off);font-family:inherit;text-align:left;cursor:pointer">
<span style="font:600 13px/1.2 Spectral,serif;color:var(--off)">Сделать нельзя</span>
<span style="font:400 10px/1.3 'IBM Plex Mono',monospace;color:var(--off);text-wrap:pretty">нет чернил с серебром · уже в «Нужно достать»</span>
</button>
</div>

<div>
<div style="display:flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)">
<span style="font:600 9.5px/1 'IBM Plex Sans';letter-spacing:.12em;color:var(--gold)">РЕЦЕПТЫ</span>
<span style="flex:1"></span>
<span style="font:400 9.5px/1.2 'IBM Plex Mono',monospace;color:var(--tx3)">4</span>
</div>
<sc-for list="{{ recipes }}" as="r" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:9px;min-height:52px;padding:5px 0;border-bottom:1px solid var(--line)">
<div style="flex:1;min-width:0">
<div style="font:600 13px/1.2 Spectral,serif">{{ r.name }}</div>
<div style="margin-top:2px;font:400 10.5px/1.35 'IBM Plex Mono',monospace;color:{{ r.subC }};text-wrap:pretty">{{ r.sub }}</div>
</div>
<button type="button" style="flex:none;min-width:88px;min-height:44px;padding:0 10px;background:{{ r.btnBg }};border:1px solid {{ r.btnBd }};font-family:inherit;font-size:12px;color:{{ r.btnCol }};cursor:pointer">{{ r.btn }}</button>
</div>
</sc-for>
<button type="button" style="display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;background:var(--bg);border:1px dashed var(--line2);font-family:inherit;font-size:12px;color:var(--tx2);cursor:pointer;text-align:left"><span style="color:var(--gold);font-size:14px">+</span>Новый рецепт</button>
</div>

</div>
<dc-import name="ArcNav" active="craft" hint-size="100%,54px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const have = (name, sub) => ({ name, sub, markBg: 'var(--gold)', markBd: 'solid var(--gold)', nameC: 'var(--tx)', subC: 'var(--tx2)' });
    const none = (name, sub) => ({ name, sub, markBg: 'transparent', markBd: 'dashed var(--off)', nameC: 'var(--tx)', subC: 'var(--off)' });
    const rec = (name, sub, btn, on) => ({
      name, sub, btn, subC: 'var(--tx3)',
      btnBg: on ? 'var(--grp)' : 'var(--ctl)',
      btnBd: on ? 'var(--goldl)' : 'var(--line2)',
      btnCol: on ? 'var(--gold)' : 'var(--tx)'
    });
    return {
      slots: [
        have('Корень мандрагоры', 'нужен 1 · есть 3'),
        have('Пергамент, лист', 'нужно 8 · есть 10'),
        none('Чернила с серебром', 'нужен 1 · нет')
      ],
      recipes: [
        rec('Свиток опознания', '8 часов · ячейка 1 уровня', 'на верстаке', true),
        rec('Копирование заклинания', '2 часа · 50 зм за уровень', 'выбрать'),
        rec('Рунная заготовка', 'час · даёт 1 руну сверх пула на день', 'выбрать'),
        rec('Мазь от ожогов', 'состав неизвестен — вписать, когда узнаешь', 'выбрать')
      ]
    };
  }
}
</script>
</body>
</html>
