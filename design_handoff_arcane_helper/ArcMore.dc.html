<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;width:100%;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden">
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;height:18px;padding:0 11px;font:500 10px/1 'IBM Plex Mono',monospace;color:var(--tx3)"><span>21:47</span><span>▮▮▯ ⌁</span></div>
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:6px 10px;border-bottom:3px double var(--gold)">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font:600 11px/1 'IBM Plex Sans';letter-spacing:.16em;color:var(--gold)">{{ title }}</span>
<span style="font:400 10px/1.3 'IBM Plex Mono',monospace;color:var(--tx3);text-wrap:pretty">{{ sub }}</span>
</div>
<div style="flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;background:var(--grp);border:1px solid var(--line2)">
<span style="font:400 9px/1.2 'IBM Plex Mono',monospace;color:var(--tx3)">{{ badgeLabel }}</span>
<span style="font:600 15px/1 Spectral,serif">{{ badgeVal }}</span>
</div>
</div>

<div data-more-scroll="1" style="flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
<div>
<div style="display:flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)">
<span style="font:600 9.5px/1 'IBM Plex Sans';letter-spacing:.12em;color:var(--gold)">{{ s.title }}</span>
<span style="flex:1"></span>
<span style="font:400 9.5px/1.2 'IBM Plex Mono',monospace;color:var(--tx3)">{{ s.note }}</span>
</div>
<sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:9px;min-height:52px;padding:5px 0;border-bottom:1px solid var(--line)">
<sc-if value="{{ r.hasMark }}" hint-placeholder-val="{{ false }}">
<span style="flex:none;width:13px;height:13px;background:{{ r.markBg }};border:1px {{ r.markBd }}"></span>
</sc-if>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 6px">
<span style="font:600 13.5px/1.2 Spectral,serif;color:{{ r.nameC }}">{{ r.name }}</span>
<sc-for list="{{ r.tags }}" as="t" hint-placeholder-count="1">
<span style="padding:1px 5px;border:1px solid {{ t.c }};font:400 10px/1.3 'IBM Plex Mono',monospace;color:var(--tx);white-space:nowrap">{{ t.label }}</span>
</sc-for>
</div>
<div style="margin-top:2px;font:400 10.5px/1.35 'IBM Plex Mono',monospace;color:{{ r.subC }};text-wrap:pretty">{{ r.sub }}</div>
</div>
<sc-if value="{{ r.btn }}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex:none;min-width:{{ r.btnW }};min-height:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;background:{{ r.btnBg }};border:1px {{ r.btnBd }};font-family:inherit;font-size:12.5px;color:{{ r.btnCol }};cursor:pointer;text-align:center">{{ r.btn }}</button>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
<dc-import name="ArcNav" active="{{ navKey }}" hint-size="100%,54px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;log&quot;,&quot;rest&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.screen || 'book';
    const tag = (label, c) => ({ label, c: c || 'var(--line2)' });
    const row = (name, sub, btn, extra) => Object.assign({
      name, sub, btn, tags: [], btnW: '84px', hasMark: false, markBg: 'transparent', markBd: 'solid var(--line2)',
      nameC: 'var(--tx)', subC: 'var(--tx3)',
      btnBg: 'var(--ctl)', btnBd: 'solid var(--line2)', btnCol: 'var(--tx)'
    }, extra || {});
    const off = { subC: 'var(--off)', btnBg: 'var(--bg)', btnBd: 'dashed var(--off)', btnCol: 'var(--off)' };
    const gold = { btnBd: 'solid var(--gold)' };

    if (s === 'book') {
      return {
        navKey: 'book', title: 'КНИГА', sub: 'состав книги · залитая отметка — подготовлено, нажатие меняет',
        badgeLabel: 'подготовлено', badgeVal: '9/11',
        sections: [
          {
            title: 'ЗАГОВОРЫ', note: 'готовы всегда · отметка бледная',
            rows: [
              row('Электрический захват', 'касание · 3d8 электричество', '', { tags: [tag('✚ атака', 'var(--atk)')], hasMark: true, markBg: 'var(--goldq)', markBd: 'solid var(--goldl)' }),
              row('Луч холода', '60 футов · 3d8 холод', '', { tags: [tag('✚ атака', 'var(--atk)')], hasMark: true, markBg: 'var(--goldq)', markBd: 'solid var(--goldl)' }),
              row('Фокусы', '10 футов · мелкое чудо на 1 час', '', { hasMark: true, markBg: 'var(--goldq)', markBd: 'solid var(--goldl)' })
            ]
          },
          {
            title: '1 УРОВЕНЬ', note: 'в книге 5 · подготовлено 3',
            rows: [
              row('Щит', 'реакция · КД +5 до начала следующего хода', '', { tags: [tag('◇ защита', 'var(--def)')], hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Доспехи мага', 'действие · КД 13, держится 8 часов', '', { tags: [tag('◇ защита', 'var(--def)')], hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Опознание', 'ритуал · держится 10 минут, ячейка не тратится', '', { tags: [tag('✦ ритуал', 'var(--rit)')], hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Волшебная стрела', 'действие · 3 стрелы по 1d4+1', '', { hasMark: true }),
              row('Обнаружение магии', 'ритуал · концентрация 10 минут', '', { tags: [tag('✦ ритуал', 'var(--rit)')], hasMark: true })
            ]
          },
          {
            title: '2 УРОВЕНЬ', note: 'в книге 4 · подготовлено 3',
            rows: [
              row('Туманный шаг', 'бонусное действие · 30 футов', '', { hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Паутина', 'концентрация 1 час · куб 20 футов', '', { hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Зеркальный образ', 'действие · три двойника', '', { hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Тьма', 'концентрация 10 минут · шар 15 футов', '', { hasMark: true })
            ]
          },
          {
            title: '3 УРОВЕНЬ', note: 'в книге 3 · подготовлено 2',
            rows: [
              row('Контрзаклинание', 'реакция · 60 футов', '', { tags: [tag('◇ защита', 'var(--def)')], hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Молния', 'действие · линия 100 футов, 8d6', '', { tags: [tag('✚ атака', 'var(--atk)')], hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Полёт', 'концентрация 10 минут · скорость полёта 60 футов', '', { hasMark: true })
            ]
          },
          {
            title: '4 УРОВЕНЬ', note: 'в книге 2 · подготовлено 1',
            rows: [
              row('Превращение', 'концентрация 1 час · нужен кокон гусеницы', '', { hasMark: true, markBg: 'var(--gold)', markBd: 'solid var(--gold)' }),
              row('Каменная кожа', 'готовить нельзя: не переписана в книгу — на «Ремесле» нужен пергамент', '', { hasMark: true, markBd: 'dashed var(--off)', subC: 'var(--off)' })
            ]
          }
        ]
      };
    }

    if (s === 'log') {
      return {
        navKey: 'log', title: 'ЛОГИ', sub: 'что случилось и как это отменить',
        badgeLabel: 'событий за бой', badgeVal: '6',
        sections: [
          {
            title: 'ЭТОТ РАУНД', note: 'отмена возвращает ровно то, что названо',
            rows: [
              row('Потрачена ячейка 2 уровня', '21:47 · Паутина · отмена вернёт ячейку 2 уровня и снимет действующую паутину', 'Отменить', gold),
              row('Потрачена реакция', '21:47 · Щит · отмена вернёт реакцию и снимет КД +5', 'Отменить', gold)
            ]
          },
          {
            title: 'РАУНД 2', note: '',
            rows: [
              row('Хиты 60 → 41', '21:46 · урон 19, огонь · отмена вернёт 19 хитов', 'Отменить', gold),
              row('Потрачена ячейка 4 уровня', '21:45 · Превращение · отмена вернёт ячейку 4 уровня', 'Отменить', gold)
            ]
          },
          {
            title: 'ДО БОЯ', note: 'старше боя — отмена запрещена',
            rows: [
              row('Начат бой', '21:44 · инициатива 14 · отмена закончит бой и вернёт значки хода', 'Отменить', gold),
              row('Короткий отдых', '21:12 · вернулись руны 3/3, потрачена 1 кость хитов · отменить нельзя: между этим событием и сейчас прошёл бой', 'нельзя', Object.assign({ btnW: '90px' }, off))
            ]
          }
        ]
      };
    }

    return {
      navKey: 'rest', title: 'ПРИВАЛ', sub: 'короткий отдых · долгий отдых · магическое восстановление',
      badgeLabel: 'кости хитов', badgeVal: '7/7',
      sections: [
        {
          title: 'КОРОТКИЙ ОТДЫХ', note: 'час покоя',
          rows: [
            row('Потратить кость хитов', 'd6+3 хитов сразу · осталось 7 из 7', 'Бросить', gold),
            row('Закончить короткий отдых', 'вернутся руны 3/3 · истощение не снимается · хиты не восстанавливаются сами', 'Закончить', Object.assign({ btnW: '96px' }, gold))
          ]
        },
        {
          title: 'МАГИЧЕСКОЕ ВОССТАНОВЛЕНИЕ', note: 'раз в день, после короткого отдыха',
          rows: [
            row('Вернуть ячейки суммой 4 уровня', 'например 2 + 2, или 3 + 1, или 4 · ячейки 5 уровня и выше не возвращаются', 'Выбрать', Object.assign({ btnW: '90px' }, gold))
          ]
        },
        {
          title: 'ДОЛГИЙ ОТДЫХ', note: 'восемь часов',
          rows: [
            row('Закончить долгий отдых', 'вернутся все ячейки 4/3/3/1 · хиты до максимума 60 · вернётся максимум 6 · истощение 2 → 1 · кости хитов 7 из 7', 'Закончить', Object.assign({ btnW: '96px' }, gold))
          ]
        },
        {
          title: 'РЕГЕНЕРАЦИЯ ЛУННОГО ТРОЛЛЯ', note: 'сама, без отдыха',
          rows: [
            row('Прошёл час', 'вернётся максимум 6 · регенерация 5 хитов · сейчас идёт бой, кнопка вернётся после боя', 'нельзя', Object.assign({ btnW: '90px' }, off))
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
