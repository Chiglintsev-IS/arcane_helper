<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;width:100%;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden">
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;height:18px;padding:0 11px;font:500 10px/1 'IBM Plex Mono',monospace;color:var(--tx3)"><span>21:47</span><span>▮▮▯ ⌁</span></div>
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:6px 10px;border-bottom:3px double var(--gold)">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font:600 11px/1 'IBM Plex Sans';letter-spacing:.16em;color:var(--gold)">ЖУРНАЛ</span>
<span style="font:400 10px/1.3 'IBM Plex Mono',monospace;color:var(--tx3)">записи игрока · 14 всего</span>
</div>
</div>

<div data-journal-scroll="1" style="flex:1;min-height:0;overflow-y:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:11px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="2">
<div>
<div style="display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--line)">
<span style="font:600 9.5px/1 'IBM Plex Sans';letter-spacing:.12em;color:var(--gold)">{{ d.title }}</span>
<span style="flex:1"></span>
<span style="font:400 9.5px/1.2 'IBM Plex Mono',monospace;color:var(--tx3)">{{ d.note }}</span>
</div>
<sc-for list="{{ d.notes }}" as="n" hint-placeholder-count="4">
<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px">
<span style="flex:none;width:34px;font:500 10.5px/1.5 'IBM Plex Mono',monospace;color:var(--tx3)">{{ n.time }}</span>
<span style="flex:1;min-width:0;font:400 12.5px/1.45 'IBM Plex Sans';color:var(--tx);text-wrap:pretty">{{ n.text }}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="flex:none;display:flex;align-items:center;gap:7px;padding:7px 10px 8px;background:var(--grp);border-top:1px solid var(--line2)">
<button type="button" style="flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line2);font-size:15px;color:var(--gold);cursor:pointer">⌕</button>
<div style="flex:1;min-width:0;min-height:44px;display:flex;align-items:center;padding:0 10px;background:var(--bg);border:1px solid var(--line2)">
<span style="font:400 12.5px/1.4 'IBM Plex Sans';color:var(--tx3)">Записать…</span>
</div>
<button type="button" style="flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--ctl);border:1px solid var(--gold);font-size:15px;color:var(--gold);cursor:pointer">↵</button>
</div>
<dc-import name="ArcNav" active="journal" hint-size="100%,54px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return {
      days: [
        {
          title: 'СЕГОДНЯ · 22 АВГУСТА', note: '6 записей',
          notes: [
            { time: '21:46', text: 'Гуль не горит, но от холода дёргается. Луч холода работает лучше молнии.' },
            { time: '21:44', text: 'Их трое, четвёртый на балке сверху — не забыть про него.' },
            { time: '21:31', text: 'Мирта сказала: «пергамент возит только Кривой Ян, по четвергам».' },
            { time: '21:12', text: 'Отдыхали в подвале, слышали шаги над головой. Мастер сделал вид, что это ничего.' },
            { time: '20:58', text: 'Барон обещал 300 зм за печать. Обещал словами, при свидетелях — Кален слышал.' },
            { time: '20:41', text: 'Хозяйку «Трёх фонарей» зовут Мирта. Должен ей 40 зм до новой луны.' }
          ]
        },
        {
          title: '8 АВГУСТА', note: '8 записей',
          notes: [
            { time: '22:10', text: 'Кален не умеет читать. Не давать ему записки, говорить вслух.' },
            { time: '21:35', text: 'В библиотеке верхняя полка заперта. Ключ у настоятеля, настоятель пьёт по средам.' }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
