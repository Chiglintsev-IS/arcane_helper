<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;width:100%;min-width:0;position:relative;overflow:hidden;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif">
<div style="position:absolute;inset:0;display:flex"><dc-import name="ListA" style="flex:1;min-width:0" hint-size="100%,100%"></dc-import></div>
<div style="position:absolute;inset:0;background:rgba(8,6,4,.62)"></div>

<div style="position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--gold);box-shadow:0 -14px 34px rgba(0,0,0,.45)">
<div style="display:flex;align-items:center;justify-content:center;padding:7px 0 3px"><span style="width:38px;height:3px;background:var(--line2)"></span></div>

<div style="padding:2px 12px 0;display:flex;align-items:baseline;justify-content:space-between;gap:10px">
<div style="min-width:0">
<div style="font:600 18px/1.15 Spectral,serif;color:var(--tx)">{{ title }}</div>
<div style="margin-top:2px;font:400 10.5px/1.35 'IBM Plex Mono',monospace;color:var(--tx3)">{{ sub }}</div>
</div>
<button type="button" style="flex:none;min-width:44px;min-height:44px;padding:0 10px;background:transparent;border:0;font-family:inherit;font:500 13px/1 'IBM Plex Sans';color:var(--gold);cursor:pointer">Готово</button>
</div>

<sc-if value="{{ isNum }}" hint-placeholder-val="{{ true }}">
<div style="padding:8px 12px 0;display:flex;align-items:center;gap:10px">
<button type="button" style="flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--ctl);border:1px solid var(--line2);font:400 22px/1 'IBM Plex Mono',monospace;color:var(--tx);cursor:pointer">−</button>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px">
<span style="font:600 40px/1 Spectral,serif;color:var(--tx)">{{ big }}</span>
<span style="font:500 12px/1 'IBM Plex Mono',monospace;color:var(--gold)">{{ bigSub }}</span>
</div>
<button type="button" style="flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--ctl);border:1px solid var(--line2);font:400 22px/1 'IBM Plex Mono',monospace;color:var(--tx);cursor:pointer">+</button>
</div>
<sc-if value="{{ hasQuick }}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 12px 0;display:flex;gap:6px">
<sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
<button type="button" style="flex:1;min-height:44px;background:var(--ctl);border:1px solid var(--line2);font-family:inherit;font:500 13px/1 'IBM Plex Mono',monospace;color:var(--tx);cursor:pointer">{{ q }}</button>
</sc-for>
</div>
</sc-if>
</sc-if>

<sc-if value="{{ isText }}" hint-placeholder-val="{{ false }}">
<div style="padding:9px 12px 0">
<div style="min-height:50px;display:flex;align-items:center;padding:0 11px;background:var(--bg);border:1px solid var(--gold)">
<span style="font:400 15px/1.4 'IBM Plex Sans';color:var(--tx)">{{ textVal }}</span>
<span style="width:1.5px;height:20px;margin-left:1px;background:var(--gold)"></span>
</div>
</div>
</sc-if>

<sc-if value="{{ derived }}" hint-placeholder-val="{{ false }}">
<div style="margin:10px 12px 0;border-top:1px solid var(--line);padding-top:7px">
<div style="font:600 9.5px/1 'IBM Plex Sans';letter-spacing:.12em;color:var(--tx2)">{{ derivedTitle }}</div>
<div style="margin-top:5px;display:flex;flex-direction:column;gap:3px">
<sc-for list="{{ derived }}" as="d" hint-placeholder-count="3">
<div style="display:flex;align-items:baseline;gap:7px">
<span style="flex:1;min-width:0;font:400 12px/1.35 'IBM Plex Sans';color:var(--tx2)">{{ d.label }}</span>
<span style="flex:none;font:500 12px/1 'IBM Plex Mono',monospace;color:var(--tx3)">{{ d.was }}</span>
<span style="flex:none;font:400 11px/1 'IBM Plex Mono',monospace;color:var(--tx3)">→</span>
<span style="flex:none;min-width:30px;text-align:right;font:500 12.5px/1 'IBM Plex Mono',monospace;color:var(--gold)">{{ d.now }}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<div style="margin:9px 0 0;padding:8px 12px 10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--grp)">
<div style="flex:1;min-width:0;font:400 11.5px/1.4 'IBM Plex Sans';color:var(--tx2);text-wrap:pretty">{{ footNote }}</div>
<sc-if value="{{ undoLabel }}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex:none;min-height:44px;padding:0 12px;background:var(--ctl);border:1px solid var(--goldl);font-family:inherit;font:500 12.5px/1 'IBM Plex Sans';color:var(--gold);cursor:pointer">{{ undoLabel }}</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ability&quot;,&quot;hp&quot;,&quot;text&quot;],&quot;default&quot;:&quot;ability&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.state || 'ability';
    const d = (label, was, now) => ({ label, was, now });
    if (v === 'hp') {
      return {
        isNum: true, isText: false, hasQuick: true,
        title: 'Хиты', sub: 'нажат блок «Хиты» в «Игре»',
        big: '41/60', bigSub: 'было 60',
        quick: ['−10', '−5', '+5', '+10'],
        derivedTitle: 'ЧТО ПОМЕНЯЛОСЬ ВМЕСТЕ С ЭТИМ',
        derived: [d('Хитов осталось', '60', '41'), d('До половины (проверки смерти дальше)', '30', '30'), d('Регенерация вернёт за час', '—', '+5')],
        footNote: 'Записано в «Логи» строкой «Хиты 60 → 41, урон 19». Отсюда же и отменяется.',
        undoLabel: 'Вернуть 60'
      };
    }
    if (v === 'text') {
      return {
        isNum: false, isText: true, hasQuick: false,
        title: 'Рост и внешность', sub: 'нажат блок «Кто он» на «Листе»',
        textVal: '2,1 м, сутулый; левая рука в рунах',
        derived: null, derivedTitle: '',
        footNote: 'Свободный текст. Приложение ничего из него не выводит и ни во что не превращает.',
        undoLabel: ''
      };
    }
    return {
      isNum: true, isText: false, hasQuick: false,
      title: 'Интеллект', sub: 'нажат блок «ИНТЕЛЛЕКТ» на «Листе»',
      big: '19', bigSub: '+4 → +4',
      derivedTitle: 'ЧТО ПЕРЕСЧИТАЕТСЯ',
      derived: [d('Спасбросок · владение', '+7', '+7'), d('Магия, Анализ, Природа', '+7', '+7'), d('КД спасбросков от заклинаний', '15', '15'), d('Заклинаний в книгу за уровень', '2', '2')],
      footNote: '19 и 18 дают один модификатор +4 — ничего не изменилось. Приложение показывает это сразу, а не после закрытия.',
      undoLabel: 'Вернуть 18'
    };
  }
}
</script>
</body>
</html>
